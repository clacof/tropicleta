# Postgres local para desarrollo:  docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tropicleta
    ports:
      - "5432:5432"
    volumes:
      - tropicleta-db:/var/lib/postgresql/data
volumes:
  tropicleta-db:
